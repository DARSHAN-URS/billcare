name: ruvexi_mobile
description: "RUVEXI Salon Management SaaS - Mobile Application (Staff & Customer Operations)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  # Networking & Realtime
  dio: ^5.4.3
  supabase_flutter: ^2.5.6
  # Storage & Caching
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  # UI & Design System (Matching RUVEXI Brand)
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  # Push Notifications
  firebase_core: ^2.30.1
  firebase_messaging: ^14.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
